# OBSBOT Meet Flip (3564:ff06), firmware 4.5.3.3.
#
# Bindings below come from USB captures of OBSBOT Center (Windows 11 VM,
# USB passthrough, usbmon on the host). Each bound command was then written
# from Linux with obsbotctl and checked against the selector 6 status block
# (and, for the microphone, the USB audio interfaces).
#
# Same envelope as the Tiny line (docs/protocol.md): framed commands on XU 2
# selector 2, short settings `[id, len, value]` on selector 6. Confirmed to
# match the Tiny SE / Tiny 2 bindings: hdr `01 01 v`, auto focus mode
# (dst 02 `0236`, 0 Global / 1 Face), mic during sleep `13 01 v`, microphone
# enable `1c 01 v`, status light `1a 01 v`, sleep/resume (dst 02 `c2a0`,
# seen as resume at Center startup) and the startup read-back sequence
# (dst 0d `0818`, `0804`, `4819`, `c818`).
#
# What the Flip does NOT have, per OBSBOT Center: noise reduction, auto gain
# and radio distance. It crops digitally (zoom and "gimbal" moves are bursts
# of 16-byte `21 10` crop-window settings on selector 6), so there is no
# joystick velocity and no gimbal reset here. Gesture zoom exists, see the
# unbound list below.
#
# Status read-back offsets measured on this model (selector 6 status block):
# hdr [6], auto focus mode [13], mic during sleep [16], mirror [19],
# brightness [33], microphone [34] bit 0x10, pickup mode [40] bits 0x38,
# status light on/off [45], asleep [9] bit 0x02 (01 awake, 03 asleep). Byte 43 drifts on its own and is ignored.
#
# Seen in the captures but NOT bound yet (needs a new binding type):
#   one combined setting, short `20 05 A B G fLo fHi`, rewritten whole on
#   every change: A auto framing (0/1), B composition (0 Group, 1 Single
#   close-up, 2 Upper body), G gesture zoom (0/1), f gesture zoom factor
#   x100 as u16 LE. Read back from the u16 at status [38..40]:
#   factor << 4 | G << 3 | B << 1 | A. Needs a read-modify-write binding.
#   presets             3 slots, but on dst 02 (`42d0` read, `82d0` save and
#                       delete, `c2d0` recall) with a name field, unlike the
#                       Tiny's dst 04 `4439` / `c439`
#   digital zoom/crop   short `21 10` + 4 x i32 crop window
# Beauty and blur produced no camera traffic (`12 01 01` is also sent at
# every startup), so they are probably applied on the host by Center.
#
# Image controls, pan/tilt/zoom and focus are standard UVC controls
# (inherited from generic-uvc). AI and audio features use the vendor
# protocol on Extension Unit 2 -- see docs/protocol.md.

id = "meet-flip"
name = "OBSBOT Meet Flip"
inherits = "generic-uvc"

# Firmware version and serial number via system module queries.
system_info = true

[[match]]
vendor_id = 0x3564
product_id = 0xff06

# Sleep/resume: ISP u32, 1 sleep, 0 wake.
[features.sleep]
status = 9
status_mask = 0x02
frames = [{ dst = 0x02, cmd = "c2a0", value = "u32" }]

# Image
[features.hdr]
status = 6
short = { id = 0x01 }

# 0 Global, 1 Face
[features.auto_focus_mode]
status = 13
frames = [{ dst = 0x02, cmd = "0236", value = "u32" }]

# Audio
[features.mic_during_sleep]
status = 16
short = { id = 0x13 }

# The camera value is 1 while the microphone is enabled; with 0 the camera
# re-enumerates on USB (new device number) without its audio interface.
[features.disable_microphone]
status = 34
status_mask = 0x10
short = { id = 0x1c }
invert = true

# Indicator: 0 off, 1..3 brightness. Unlike the Tiny, on/off and brightness
# live in different status bytes ([45] and [33]).
[features.status_light]
status = 45
short = { id = 0x1a }
level = "switch"
default_level = 3

[features.status_light_brightness]
status = 33
short = { id = 0x1a }
level = "magnitude"
default_level = 3

# Pickup mode: short `22 02 00 v`. 05 Pure Audio, 00 Smart Omni,
# 02 Directional, 04 Dual-Directional.
[features.audio_mode]
status = 40
status_mask = 0x38
short = { id = 0x22, prefix = "00" }

# Field of view: short `04 01 v`. 00 Wide, 01 Medium, 02 Narrow.
[features.field_of_view]
short = { id = 0x04 }

# Mirror image, on the camera.
[features.mirror_image]
status = 19
short = { id = 0x14 }
